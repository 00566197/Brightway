{% extends 'base.html'%}
{% from 'bootstrap5/form.html' import render_field, render_form_row %}

{% block content %}
    <div class="container py-5">
        <div class="row">
            <div class="col">
                <div class="card">
                    <div class="card-body">
                        <div class="card-title fw-bold text-center">Sign Up</div>
                        <form action="" method="post",onS>
                        {{form.csrf_token()}}
                        {{render_field(form.username)}}
                        {{render_field(form.password)}}
                        <div class="d-grid">
                        {{render_field(form.submit)}}
                        </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{%endblock%}
